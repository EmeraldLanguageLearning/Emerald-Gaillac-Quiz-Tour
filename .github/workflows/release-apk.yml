name: Publish APK release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the Build APK run whose APK should be released"
        required: true
      tag:
        description: "Release tag, e.g. v1.0"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download APK from that build
        run: |
          gh run download "${{ inputs.run_id }}" -n GaillacTour-apk -D out
          mv out/app-debug.apk GaillacTour.apk
      - name: Create release
        run: |
          gh release create "${{ inputs.tag }}" GaillacTour.apk \
            --title "Gaillac Tour ${{ inputs.tag }}" \
            --notes "Android APK from build run ${{ inputs.run_id }}. Download GaillacTour.apk on your phone and open it to install (allow installs from unknown sources when asked)."
